<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 154" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS animated status display</title>
  <desc id="desc">A dark red and gold animated status display for Rain Vale's GitHub profile.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="0.55" stop-color="#161016"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#C0392B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E7B84B"/>
      <stop offset="1" stop-color="#C0392B" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1.5" y="1.5" width="897" height="151" rx="10" fill="url(#panel)" stroke="#C0392B" stroke-opacity="0.78" stroke-width="3"/>
  <path d="M28 36H300M600 36H872M28 120H240M660 120H872" stroke="#E7B84B" stroke-opacity="0.26"/>
  <path d="M28 51H872" stroke="url(#line)" stroke-width="2"/>
  <path d="M28 104H872" stroke="#F3F5F7" stroke-opacity="0.08" stroke-dasharray="2 9"/>
  <g font-family="JetBrains Mono, Consolas, monospace" letter-spacing="2">
    <text x="30" y="27" fill="#E7B84B" font-size="12">JARVIS // LIVE TELEMETRY</text>
    <text x="870" y="27" text-anchor="end" fill="#C0392B" font-size="12">MARK 85</text>
    <g fill="#F3F5F7" font-size="22" filter="url(#glow)">
      <text x="50" y="88" opacity="1">JARVIS ONLINE<tspan fill="#E7B84B"> / SYSTEM READY</tspan>
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="1;1;0;0;0;0;1" keyTimes="0;0.22;0.3;0.58;0.66;0.92;1"/>
      </text>
      <text x="50" y="88" opacity="0">用数据构建体验<tspan fill="#E7B84B"> / BUILDING IN PUBLIC</tspan>
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0;0" keyTimes="0;0.22;0.3;0.54;0.62;0.92;1"/>
      </text>
      <text x="50" y="88" opacity="0">FRONTEND × DATA × 3D<tspan fill="#E7B84B"> / NEXT ITERATION</tspan>
        <animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;0;0;1;1;0" keyTimes="0;0.22;0.3;0.54;0.62;0.92;1"/>
      </text>
    </g>
    <rect x="55" y="111" width="12" height="2" fill="#E7B84B">
      <animate attributeName="opacity" dur="0.9s" repeatCount="indefinite" values="1;0;1"/>
    </rect>
    <text x="30" y="139" fill="#9CA3AF" font-size="11">RAIN VALE / DIGITAL EXPERIENCE LAB</text>
    <text x="870" y="139" text-anchor="end" fill="#9CA3AF" font-size="11">STATUS: BUILDING</text>
  </g>
</svg>
