name: Update profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'scripts/update-profile-stats.mjs'
      - '.github/workflows/update-profile-stats.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Update generated SVG cards
        run: node scripts/update-profile-stats.mjs
      - name: Commit refreshed telemetry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/language-matrix.svg
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh profile telemetry'
          git push
